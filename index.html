<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Frame2D</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font:14px/1.3 system-ui,"Segoe UI",Roboto,sans-serif;color:#1b2430;background:#f4f6fa;overflow:hidden;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font:inherit;min-height:38px;padding:0 10px;border:1px solid #c5cdd9;border-radius:8px;background:#fff;color:#1b2430;white-space:nowrap;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.active{background:#2563eb;color:#fff;border-color:#2563eb}
button.primary{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:600}
button.danger{color:#b42318;border-color:#f1b5ae}
#bar{display:flex;gap:6px;padding:6px;overflow-x:auto;background:#1f3a5f;flex:none;align-items:center}
#bar .sep{width:1px;align-self:stretch;background:#ffffff40;margin:0 2px;flex:none}
#topActions{display:flex;justify-content:flex-start;gap:6px;padding:2px 6px;background:#fff;flex:none}
#topActions button{min-height:32px;width:38px;padding:0}
#opts{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 8px;background:#e6ecf5;align-items:center;flex:none;min-height:46px}
#opts:empty{display:none}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.fld{display:flex;align-items:center;gap:4px;white-space:nowrap}
.num,select{height:34px;border:1px solid #b9c3d3;border-radius:6px;padding:0 6px;font:inherit;background:#fff;color:#1b2430}
.num{width:76px}
.muted{color:#5a6678;flex-basis:100%}
small.muted{font-size:12px}
#main{flex:1;display:flex;min-height:0;position:relative}
#cvwrap{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block;cursor:crosshair}
#panel{width:330px;overflow-y:auto;background:#fff;border-left:1px solid #cfd6e2;padding:8px;flex:none}
#panel.hidden{display:none}
@media (max-width:900px){
  #bar{padding:4px;gap:4px}
  #bar button{min-height:34px;padding:0 8px}
  #topActions{padding:2px 6px}
  #opts{max-height:32dvh;overflow-y:auto;padding:4px 8px;gap:4px 8px}
  #opts button{min-height:34px}
  #resbar{max-height:18dvh;overflow-y:auto;padding:4px 8px;gap:4px 8px}
  #status{font-size:12px}
  #status{justify-content:flex-end;min-height:28px}
  #status #msg{display:none}
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:46%;border-left:0;border-top:2px solid #2563eb;box-shadow:0 -4px 12px rgba(0,0,0,.18)}
}
.mobile-toggle{font-weight:600}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sec{margin:8px 0;padding-bottom:8px;border-bottom:1px solid #eef1f6}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0}
.loadrow{background:#f6f8fc;border:1px solid #e1e7f0;border-radius:8px;padding:6px;margin:6px 0}
table.res{border-collapse:collapse;font-size:13px}
table.res td,table.res th{padding:1px 8px;text-align:right;font-weight:normal}
table.res th{color:#5a6678}
table.res td:first-child,table.res th:first-child{text-align:left}
.bad{color:#b42318;font-weight:600}.good{color:#157f3b}
#resbar{display:flex;flex-wrap:wrap;gap:6px 10px;padding:5px 8px;background:#fff;border-top:1px solid #cfd6e2;align-items:center;flex:none}
#resbar button{min-height:34px}
#status{display:flex;justify-content:space-between;gap:10px;padding:4px 8px;background:#fff;border-top:1px solid #cfd6e2;font-size:13px;flex:none}
#msg{flex:1}#msg.err{color:#b42318;font-weight:600}
#coord{color:#5a6678;white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10}
#modal[hidden]{display:none}
.card{background:#fff;border-radius:12px;padding:14px;max-width:440px;width:92%;max-height:88%;overflow:auto}
.card h3{margin:0 0 8px}
.project-row{display:flex;align-items:center;gap:6px;margin:7px 0;padding:7px;background:#f6f8fc;border:1px solid #e1e7f0;border-radius:8px}
.project-row>div{flex:1;min-width:0}.project-row b,.project-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dark{color:#e5e7eb;background:#111827}
body.dark #opts{background:#1f2937}
body.dark #topActions{background:#111827}
body.dark #panel,body.dark #resbar,body.dark #status{background:#172033;color:#e5e7eb;border-color:#374151}
body.dark #cvwrap{background:#111827}
body.dark button,body.dark .num,body.dark select{background:#253044;color:#e5e7eb;border-color:#52617a}
body.dark button.active{background:#2563eb;color:#fff;border-color:#2563eb}
body.dark .loadrow{background:#202b3e;border-color:#3b4a62}
body.dark .card{background:#172033;color:#e5e7eb}
body.dark .project-row{background:#202b3e;border-color:#3b4a62}
body.dark .muted,body.dark table.res th{color:#aab6c8}
body.dark #modal{background:rgba(0,0,0,.62)}
</style>
</head>
<body>
<div id="bar">
  <button data-tool="select" title="Select / edit (V)">↖ Select</button>
  <button data-tool="node" title="Add nodes (N)">● Node</button>
  <button data-tool="member" title="Add members (M)">／ Member</button>
  <button data-tool="support" title="Supports (S)">△ Support</button>
  <button data-tool="load" title="Loads (L)">↓ Load</button>
  <button data-tool="influence" title="Influence lines (I)">∿ Influence Lines</button>
  <button data-tool="delete" title="Delete (D)">✕ Delete</button>
  <span class="sep"></span>
  <button id="bSolve" class="primary" title="Solve (Ctrl+Enter)">▶ Solve</button>
  <span class="sep"></span>
  <button id="bFit" title="Zoom to fit (F)">Fit</button>
  <button id="bZin" title="Zoom in">＋</button>
  <button id="bZout" title="Zoom out">－</button>
  <button id="bInfo" title="Info / results panel">ⓘ</button>
  <button id="bMenu" title="Menu: new, save, load, examples, theme">☰ Menu</button>
</div>
<div id="topActions">
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
</div>
<div id="opts"></div>
<div id="main">
  <div id="cvwrap"><canvas id="cv"></canvas></div>
  <aside id="panel" class="hidden"></aside>
</div>
<div id="resbar">
  <button data-mode="model">Model</button>
  <button data-mode="defl">Deflected</button>
  <button data-mode="N">N</button>
  <button data-mode="V">V</button>
  <button data-mode="M">M</button>
  <label class="fld">Size <input id="dscale" type="range" min="0.2" max="4" step="0.1" value="1"></label>
  <label class="fld"><input id="flip" type="checkbox"> Flip side</label>
</div>
<div id="status"><span id="msg"></span><span id="coord"></span></div>
<div id="modal" hidden></div>
<script src="solver2d.js"></script>
<script src="core.js"></script>
<script src="influence.js"></script>
<script src="app.js"></script>
</body>
</html>
